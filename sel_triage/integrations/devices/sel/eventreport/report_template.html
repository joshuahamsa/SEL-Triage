<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEL Event Analysis</title><style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#121a24;--line:#2a3a4d;--text:#e7edf5;--muted:#91a2b7;--accent:#ffb224;--a:#ef5350;--b:#42a5f5;--c:#66bb6a;--g:#ffca28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}header{padding:18px 24px;background:#101923;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:21px}h2{font-size:14px;margin:0 0 10px}.meta{color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px;overflow:hidden}.stack{display:grid;gap:12px}.side{display:grid;gap:12px;align-content:start}.chart{width:100%;height:255px;display:block;touch-action:none}.digital{height:320px}.phasor{width:100%;height:180px}.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:5px}.controls label{white-space:nowrap;color:var(--muted)}button{background:#1d2b3b;color:var(--text);border:1px solid #38506b;border-radius:4px;padding:5px 9px}.readout{width:100%;border-collapse:collapse}.readout td{padding:3px 5px;border-bottom:1px solid #223042}.warning{padding:7px;background:#3a2b12;border-left:3px solid var(--accent);margin:5px 0}.hint{color:var(--muted);font-size:12px}.axis{stroke:#5d7086;stroke-width:1}.grid{stroke:#26384b;stroke-width:1}.cursor{stroke:var(--accent);stroke-width:1.5}.trigger{stroke:#ef5350;stroke-dasharray:5 4}.label{fill:#9badc0;font-size:10px}.lane{fill:#2b8ad6}.zero{stroke:#60758c}@media(max-width:900px){.layout{grid-template-columns:1fr}}
</style></head><body>
<header><h1 id="title">SEL Event Analysis</h1><div class="meta" id="event-meta"></div></header>
<main class="layout"><div class="stack">
<section class="panel"><h2>Analog Signals</h2><div id="signal-controls" class="controls"></div><div class="controls"><label><input id="smooth-waveforms" type="checkbox" checked> Smooth waveforms</label><label><input id="sample-markers" type="checkbox"> Sample markers</label></div><p id="display-note" class="hint"></p><p class="hint">Wheel to zoom · drag to pan · move pointer for cursor · double-click to reset</p></section>
<section class="panel"><h2>Current Oscillography</h2><svg id="analog-current" class="chart"></svg></section>
<section class="panel"><h2>Voltage Oscillography</h2><svg id="analog-voltage" class="chart"></svg></section>
<section class="panel"><h2>Protection and Control Elements</h2><svg id="digital-timeline" class="chart digital"></svg></section>
</div><aside class="side">
<section class="panel"><h2>Cursor Readout</h2><table id="cursor-readout" class="readout"></table></section>
<section class="panel"><h2>Current Phasor</h2><svg id="phasor-current" class="phasor"></svg></section>
<section class="panel"><h2>Voltage Phasor</h2><svg id="phasor-voltage" class="phasor"></svg></section>
<section class="panel"><h2>Warnings</h2><div id="warnings"></div></section>
</aside></main>
<script type="application/json" id="event-data">__EVENT_DATA__</script><script>
const D=JSON.parse(document.getElementById('event-data').textContent), S=D.samples;
const colors={IA:'#ef5350',IB:'#42a5f5',IC:'#66bb6a',IG:'#ffca28',VAY:'#ef5350',VBY:'#42a5f5',VCY:'#66bb6a',VAZ:'#ab47bc',VBZ:'#26c6da',VCZ:'#ffa726'};
const state={fullMin:S[0].time,fullMax:S.at(-1).time,viewMin:S[0].time,viewMax:S.at(-1).time,cursorTime:0,enabled:new Set(D.channels.filter(c=>c.quantity==='current'||c.quantity==='voltage').map(c=>c.name)),smooth:true,markers:false,drag:null};
const NS='http://www.w3.org/2000/svg', el=(n,a={})=>{const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x};
function text(node,value){node.textContent=value} function asserted(x){return x==='.'?false:x.trim()?true:null}
text(document.getElementById('title'),`${D.metadata.station} · Event ${D.metadata.event_number}`);
const meta=document.getElementById('event-meta');for(const v of [D.metadata.device,D.metadata.timestamp,D.metadata.event_type,`${D.metadata.nominal_frequency_hz} Hz`,D.metadata.firmware_id]){const s=document.createElement('span');text(s,v);meta.append(s)}
const controls=document.getElementById('signal-controls');for(const c of D.channels.filter(x=>x.quantity==='current'||x.quantity==='voltage')){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=true;i.onchange=()=>{i.checked?state.enabled.add(c.name):state.enabled.delete(c.name);render()};l.append(i,` ${c.name}`);controls.append(l)}
const smoothControl=document.getElementById('smooth-waveforms'),markerControl=document.getElementById('sample-markers');smoothControl.onchange=()=>{state.smooth=smoothControl.checked;render()};markerControl.onchange=()=>{state.markers=markerControl.checked;render()};text(document.getElementById('display-note'),`Smoothed display is display-only · source ${D.metadata.samples_per_cycle} samples/cycle · cursor values are measured samples.`);
function nearest(t){return S.reduce((a,b)=>Math.abs(b.time-t)<Math.abs(a.time-t)?b:a)}
function linePath(points){return points.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ')}
function smoothPath(points){
  if(points.length<3)return linePath(points);
  const slopes=[],tangents=[];
  for(let i=0;i<points.length-1;i++)slopes.push((points[i+1].y-points[i].y)/(points[i+1].x-points[i].x));
  tangents[0]=slopes[0];tangents[points.length-1]=slopes.at(-1);
  for(let i=1;i<points.length-1;i++)tangents[i]=(slopes[i-1]+slopes[i])/2;
  for(let i=0;i<slopes.length;i++){
    if(slopes[i]===0){tangents[i]=0;tangents[i+1]=0;continue}
    const a=tangents[i]/slopes[i],b=tangents[i+1]/slopes[i],length=Math.hypot(a,b);
    if(length>3){const scale=3/length;tangents[i]=scale*a*slopes[i];tangents[i+1]=scale*b*slopes[i]}
  }
  let path=`M${points[0].x.toFixed(2)},${points[0].y.toFixed(2)}`;
  for(let i=0;i<points.length-1;i++){
    const p=points[i],q=points[i+1],dx=(q.x-p.x)/3;
    path+=` C${(p.x+dx).toFixed(2)},${(p.y+tangents[i]*dx).toFixed(2)} ${(q.x-dx).toFixed(2)},${(q.y-tangents[i+1]*dx).toFixed(2)} ${q.x.toFixed(2)},${q.y.toFixed(2)}`;
  }
  return path
}
function setup(svg){svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect(),t=state.viewMin+(e.clientX-r.left)/r.width*(state.viewMax-state.viewMin),f=e.deltaY>0?1.25:.8;state.viewMin=Math.max(state.fullMin,t-(t-state.viewMin)*f);state.viewMax=Math.min(state.fullMax,t+(state.viewMax-t)*f);render()};svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);state.drag={x:e.clientX,min:state.viewMin,max:state.viewMax}};svg.onpointermove=e=>{const r=svg.getBoundingClientRect();if(state.drag){const dt=(e.clientX-state.drag.x)/r.width*(state.drag.max-state.drag.min);state.viewMin=Math.max(state.fullMin,state.drag.min-dt);state.viewMax=Math.min(state.fullMax,state.drag.max-dt)}else state.cursorTime=state.viewMin+(e.clientX-r.left)/r.width*(state.viewMax-state.viewMin);render()};svg.onpointerup=()=>state.drag=null;svg.ondblclick=()=>{state.viewMin=state.fullMin;state.viewMax=state.fullMax;render()}}
function chart(id,quantity){const svg=document.getElementById(id),w=svg.clientWidth||800,h=svg.clientHeight||255,m={l:55,r:12,t:10,b:24};svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const channels=D.channels.filter(c=>c.quantity===quantity&&state.enabled.has(c.name)),visible=S.filter(s=>s.time>=state.viewMin&&s.time<=state.viewMax);let vals=visible.flatMap(s=>channels.map(c=>s.analog[c.name]));let lo=Math.min(...vals,0),hi=Math.max(...vals,0);if(lo===hi){lo--;hi++}const x=t=>m.l+(t-state.viewMin)/(state.viewMax-state.viewMin)*(w-m.l-m.r),y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);for(let k=0;k<5;k++){const yy=m.t+k*(h-m.t-m.b)/4;svg.append(el('line',{x1:m.l,x2:w-m.r,y1:yy,y2:yy,class:'grid'}))}svg.append(el('line',{x1:m.l,x2:w-m.r,y1:y(0),y2:y(0),class:'zero'}));for(const c of channels){const points=visible.map(s=>({x:x(s.time),y:y(s.analog[c.name])})),stroke=colors[c.name]||'#ddd';svg.append(el('path',{d:state.smooth?smoothPath(points):linePath(points),fill:'none',stroke,'stroke-width':1.5}));if(state.markers)for(const p of points)svg.append(el('circle',{cx:p.x,cy:p.y,r:2.5,fill:stroke,stroke:'#121a24','stroke-width':1}))}svg.append(el('line',{x1:x(0),x2:x(0),y1:m.t,y2:h-m.b,class:'trigger'}),el('line',{x1:x(state.cursorTime),x2:x(state.cursorTime),y1:m.t,y2:h-m.b,class:'cursor'}));const u=el('text',{x:4,y:14,class:'label'});text(u,quantity==='current'?'A primary':'kV primary');svg.append(u)}
function digital(){const svg=document.getElementById('digital-timeline'),active=D.digital.filter(d=>d.states.some(asserted)),w=svg.clientWidth||800,row=18,h=Math.max(90,active.length*row+28),left=210;svg.style.height=`${Math.min(650,h)}px`;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();const x=t=>left+(t-state.viewMin)/(state.viewMax-state.viewMin)*(w-left-10),dt=S.length>1?S[1].time-S[0].time:1;active.forEach((d,j)=>{const y=10+j*row;const lab=el('text',{x:4,y:y+11,class:'label'});text(lab,d.name);svg.append(lab);let start=null;d.states.forEach((raw,i)=>{const on=asserted(raw),t=S[i].time;if(on&&start===null)start=t;if((!on||i===d.states.length-1)&&start!==null){const end=on?t+dt:t;if(end>=state.viewMin&&start<=state.viewMax)svg.append(el('rect',{x:x(Math.max(start,state.viewMin)),y,width:Math.max(1,x(Math.min(end,state.viewMax))-x(Math.max(start,state.viewMin))),height:12,class:'lane'}));start=null}})});svg.append(el('line',{x1:x(0),x2:x(0),y1:0,y2:h,class:'trigger'}),el('line',{x1:x(state.cursorTime),x2:x(state.cursorTime),y1:0,y2:h,class:'cursor'}))}
function phasor(id,quantity,sample){const svg=document.getElementById(id),w=svg.clientWidth||270,h=180,cx=w/2,cy=h/2,n=D.metadata.samples_per_cycle;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren(el('line',{x1:15,x2:w-15,y1:cy,y2:cy,class:'axis'}),el('line',{x1:cx,x2:cx,y1:10,y2:h-10,class:'axis'}));if(sample.index<n-1)return;const chans=D.channels.filter(c=>c.quantity===quantity&&/A|B|C/.test(c.name));let vecs=[];for(const c of chans){let re=0,im=0;for(let k=0;k<n;k++){const v=S[sample.index-n+1+k].analog[c.name],a=-2*Math.PI*k/n;re+=v*Math.cos(a);im+=v*Math.sin(a)}vecs.push([c,Math.hypot(re,im)*2/n/Math.sqrt(2),Math.atan2(im,re)])}const max=Math.max(...vecs.map(v=>v[1]),1);for(const[c,mag,a]of vecs){const p=el('line',{x1:cx,y1:cy,x2:cx+Math.cos(a)*mag/max*(w*.36),y2:cy-Math.sin(a)*mag/max*(h*.36),stroke:colors[c.name]||'#ddd','stroke-width':2});svg.append(p)}}
function readout(){const s=nearest(state.cursorTime),table=document.getElementById('cursor-readout');table.replaceChildren();const rows=[['Time',`${s.time.toFixed(3)} ms`],...D.channels.map(c=>[c.name,`${s.analog[c.name]} ${c.unit}`])];for(const[a,b]of rows){const tr=document.createElement('tr'),x=document.createElement('td'),y=document.createElement('td');text(x,a);text(y,b);tr.append(x,y);table.append(tr)}phasor('phasor-current','current',s);phasor('phasor-voltage','voltage',s)}
function render(){chart('analog-current','current');chart('analog-voltage','voltage');digital();readout()}
for(const id of ['analog-current','analog-voltage','digital-timeline'])setup(document.getElementById(id));const warnings=document.getElementById('warnings');for(const w of D.metadata.warnings){const d=document.createElement('div');d.className='warning';text(d,w);warnings.append(d)}if(!D.metadata.warnings.length)text(warnings,'No parser warnings.');new ResizeObserver(render).observe(document.querySelector('main'));render();
</script></body></html>
