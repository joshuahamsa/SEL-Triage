[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sel-triage"
version = "0.1.0"
description = "Read-only triage tools for SEL relays, meters and RTACs: snapshots, event reports, settings capture, checks and diffs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Hamsa" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
rdb = ["olefile>=0.47"]
s3 = ["boto3>=1.34"]
test = ["pytest>=8", "olefile>=0.47"]

[project.scripts]
sel-triage = "sel_triage.cli:main"

[tool.setuptools.packages.find]
include = ["sel_triage*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"sel_triage.integrations.devices.sel.reference" = ["commands/*.json", "README.md"]
"sel_triage.integrations.devices.sel.eventreport" = ["report_template.html"]
